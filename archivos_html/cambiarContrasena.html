<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack - Perfil</title>

    <link rel="stylesheet" href="../info/coloresGlobales.css">
    <link rel="stylesheet" href="../archivos_css/cambiarContrasena.css">

    <script src="../archivos_js/cambiarContrasena.js" defer></script>
</head>
<body>

    <!-- Barra superior -->
    <div class="top-bar">
        <div class="logo">BLACKJACK</div>
        <div class="usuario">
            Usuario: <span id="nombreUsuario"></span><br>
            Puntos: <span id="puntosUsuario"></span>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="main">
        <div class="perfil-container">

            <h2>Cambio Contraseña</h2>

            <!-- Datos -->
            <div class="datos">

                <div class="campo">
                    <label>Contraseña actual</label>
                    <input type="password" class="valor" id="contraseñaActual">
                </div>

                <div class="campo">
                    <label>Contraseña nueva</label>
                    <input type="password" class="valor" id="contraseñaNueva">
                </div>

                <div class="campo">
                    <label>Repite contraseña nueva</label>
                    <input type="password" class="valor" id="contraseñaNuevaRepetida">
                </div>

            </div>

            <!-- Acciones -->
            <div class="acciones">
                <button class="btn grande" id="cambiarContraseña">Cambiar contraseña</button>
                <button class="btn grande" id="volver">Volver</button>
            </div>

            <div id="info" class="info"></div>
            <div id="errores" class="errores"></div>

        </div>
        
    </div>

</body>
</html>
