<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module" src="../archivos_js/jugarOnline.js" defer></script>

    <link rel="stylesheet" href="../info/coloresGlobales.css">
    <link rel="stylesheet" href="../info/estilosGlobales.css">
    <link rel="stylesheet" href="../archivos_css/jugarOnline.css">

</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">

        <div class="logo">
            BLACKJACK
        </div>

        <div class="usuario">
            Usuario: <span id="nombreUsuario"></span><br>
            Puntos totales: <span id="puntosTotales"></span>
        </div>

    </div>

    <!-- CONTENIDO -->
    <div class="main">

        <div class="juego-container">

            <h1>BLACKJACK</h1>

            <!-- APUESTA -->
            <div class="apuesta-box">
                Apuesta actual:
                <span id="apuestaTexto"></span>
            </div>

            <!-- ZONAS DEL JUEGO -->
            <!-- CRUPIER -->
            <div class="zona-crupier">

                <h2>Crupier</h2>

                <div id="manoCrupier" class="mano"></div>

                <p id="puntosCrupier" class="puntos"></p>

            </div>


            <!-- JUGADORES -->
            <div class="jugadores-online">

                <!-- JUGADOR 1 -->
                <div class="zona">

                    <h2 id="nombreJugador1">
                        Jugador 1
                    </h2>

                    <div id="manoJugador1" class="mano"></div>

                    <p id="puntosJugador1" class="puntos"></p>

                </div>

                <!-- JUGADOR 2 -->
                <div class="zona">

                    <h2 id="nombreJugador2">
                        Jugador 2
                    </h2>

                    <div id="manoJugador2" class="mano"></div>

                    <p id="puntosJugador2" class="puntos"></p>

                </div>

            </div>

            <!-- RESULTADO -->
            <h3 id="resultado"></h3>

            <!-- BOTONES -->
            <div class="acciones">

                <button class="btn grande" id="pedir">
                    Pedir carta
                </button>

                <button class="btn grande" id="plantarse">
                    Plantarse
                </button>

                <button class="btn grande oculto" id="reiniciar">
                    Nueva partida
                </button>

                <button class="btn grande oculto" id="volverMenu">
                    Volver al menú
                </button>

            </div>

        </div>

    </div>

</body>
</html>
