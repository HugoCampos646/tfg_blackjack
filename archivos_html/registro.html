<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Blackjack</title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <link rel="stylesheet" href="../info/coloresGlobales.css">
    <link rel="stylesheet" href="../archivos_css/registro.css">
    <link rel="stylesheet" href="../info/estilosGlobales.css">

    <!-- Script -->
    <script type="module" src="../archivos_js/registro.js" defer></script>

</head>
<body>

    <div class="particulas"></div>

    <div class="container">
        <h1>REGISTRO</h1>

        <input type="text" id="nombre" name="usuario" placeholder="Usuario" class="input" maxlength="10">

        <input type="password" id="contraseña" name="password" placeholder="Contraseña" class="input" maxlength="10">

        <input type="password" id="contraseñaRepetida" name="confirmar" placeholder="Confirmar contraseña" class="input" maxlength="10">

        <button id="btnAceptar" class="btn">Crear cuenta</button>

        <button id="btnMenu" class="btn">Volver al menú</button>

        <div id="info" class="info">
            Crea una cuenta y empieza con 1000 puntos iniciales
        </div>

        <div id="errores" class="errores"></div>
    </div>

</body>
</html>
