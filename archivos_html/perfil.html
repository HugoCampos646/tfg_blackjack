<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack - Perfil</title>

    <link rel="stylesheet" href="../info/coloresGlobales.css">
    <link rel="stylesheet" href="../archivos_css/perfil.css">

    <script type="module" src="../archivos_js/perfil.js" defer></script>
</head>
<body>

    <!-- Barra superior -->
    <div class="top-bar">
        <div class="logo">BLACKJACK</div>
        <div class="usuario">
            Usuario: <span id="nombreUsuario"></span><br>
            Puntos: <span id="puntosUsuario"></span>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="main">
        <div class="perfil-container">

            <h2>Mi Perfil</h2>

            <!-- Datos -->
            <div class="datos">

                <div class="campo">
                    <label>Nombre de usuario</label>
                    <div class="valor" id="nombrePerfil"></div>
                </div>

                <div class="campo">
                    <label>Puntos</label>
                    <div class="valor" id="puntosPerfil"></div>
                </div>

            </div>

            <!-- Acciones -->
            <div class="acciones">
                <button class="btn grande" id="cambiarNombre">Cambiar nombre</button>
                <button class="btn grande" id="cambiarContraseña">Cambiar contraseña</button>
            </div>

            <div class="acciones-secundarias">
                <button class="btn pequeño cerrar" id="cerrarSesion">Cerrar sesión</button>
                <button class="btn pequeño eliminar" id="eliminarUsuario">Eliminar cuenta</button>
            </div>

        </div>
    </div>

</body>
</html>
