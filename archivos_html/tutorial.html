<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Tutoriales Blackjack</title>

    <link rel="stylesheet" href="../info/coloresGlobales.css">
    <link rel="stylesheet" href="../info/estilosGlobales.css">
    <link rel="stylesheet" href="../archivos_css/tutorial.css">

    <script type="module" src="../archivos_js/tutorial.js" defer></script>

</head>

<body>

    <div class="particulas"></div>

    <!-- Barra superior -->
    <div class="top-bar">
        <div class="logo">BLACKJACK</div>
        <div class="usuario">
            Usuario: <span id="nombreUsuario"></span><br>
            Puntos: <span id="puntosUsuario"></span>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="main">
        <div class="perfil-container">

            <h2>TUTORIALES</h2>

            <!-- Acciones -->
            <div class="acciones">
                <button class="btn grande" id="tutorialBasico">Tutorial basico</button>
                <button class="btn grande" id="tutorialAs">Tutorial As</button>
                <button class="btn grande" id="tutorialConsejos">Consejos basicos</button>
                <button class="btn grande" id="volver">Volver</button>
            </div>

            <div id="info" class="info">Elije el tutorial que deseas jugar</div>
            <div id="errores" class="errores"></div>

        </div>
        
    </div>

</body>

</html>
