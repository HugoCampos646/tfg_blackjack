<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>

    <!-- Colores globales -->
    <link rel="stylesheet" href="info/coloresGlobales.css">

    <!-- Estilos de esta página -->
    <link rel="stylesheet" href="archivos_css/index.css">
</head>
<body>

    <div class="particulas"></div>

    <div class="container">
        <h1>BLACKJACK</h1>

        <button class="btn" onclick="location.href='archivos_html/login.html'">
            Iniciar sesión
        </button>

        <button class="btn" onclick="location.href='archivos_html/registro.html'">
            Registrarse
        </button>

        <div class="info">
            Juego de Blackjack online sin apuestas reales<br>
            Empieza con 1000 puntos
        </div>
    </div>

    <script>
        // animación de partículas en el fondo
        const contenedorParticulas = document.querySelector(".particulas");

        for (let i = 0; i < 35; i++) {

            const particula =
                document.createElement("span");

            particula.style.left =
                Math.random() * 100 + "vw";

            particula.style.animationDuration =
                6 + Math.random() * 8 + "s";

            particula.style.animationDelay =
                Math.random() * 5 + "s";

            particula.style.opacity =
                Math.random();

            const tamaño =
                3 + Math.random() * 6;

            particula.style.width =
                tamaño + "px";

            particula.style.height =
                tamaño + "px";

            contenedorParticulas.appendChild(
                particula
            );
        }
    </script>

</body>
</html>
